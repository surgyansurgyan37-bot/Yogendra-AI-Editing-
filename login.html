<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Yogendra AI Editing</title>
  <link rel="stylesheet" href="auth-style.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="logo">🎬</div>
      <h1>Yogendra AI Editing</h1>
      <p class="muted">Login करके अपने video projects save करें.</p>

      <button id="googleBtn" class="btn google">Continue with Google</button>
      <div class="or"><span>या</span></div>

      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">

      <div class="row">
        <button id="loginBtn" class="btn primary">Login</button>
        <button id="signupBtn" class="btn secondary">Sign Up</button>
      </div>

      <p id="msg" class="message"></p>
      <a class="back" href="index.html">← Back to Video Maker</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
